name: Docs checks

on:
  pull_request:

jobs:
  docs-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Mintlify CLI
        run: npm i -g mint

      - name: Validate the build
        run: mint validate

      - name: Check for broken links
        run: mint broken-links
